name: bootstrap-lockfile

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  generate:
    if: >-
      github.head_ref == 'governance/bootstrap-phase-0' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_HEAD_REF}"
          git checkout FETCH_HEAD

      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --audit=false --fund=false

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: freeze npm dependency graph"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
